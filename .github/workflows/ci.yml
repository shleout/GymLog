name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` installs exactly what package-lock.json says and fails if it is out of sync.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

# Local Postgres for apps/api: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gymlog
      POSTGRES_PASSWORD: gymlog
      POSTGRES_DB: gymlog
    ports:
      # 5434 on the host: 5432/5433 are often taken by other local Postgres instances.
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymlog -d gymlog']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:

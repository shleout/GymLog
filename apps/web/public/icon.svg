<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background: the OS applies its own mask (circle/squircle), so the icon is also "maskable". -->
  <rect width="512" height="512" fill="#2f74e8"/>
  <!-- Dumbbell inside the maskable safe zone (central circle, 80% of the size). -->
  <g fill="#ffffff">
    <rect x="96" y="176" width="44" height="160" rx="14"/>
    <rect x="148" y="146" width="52" height="220" rx="16"/>
    <rect x="200" y="236" width="112" height="40" rx="10"/>
    <rect x="312" y="146" width="52" height="220" rx="16"/>
    <rect x="372" y="176" width="44" height="160" rx="14"/>
  </g>
</svg>
